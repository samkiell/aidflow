name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cargo fmt --manifest-path contract/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path contract/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path contract/Cargo.toml
      - name: Install Stellar CLI required by Soroban SDK
        run: cargo install stellar-cli --version 28.1.0
      - run: cargo build --manifest-path contract/contracts/aidflow/Cargo.toml --target wasm32v1-none --release
